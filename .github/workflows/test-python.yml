name: Test Python Script

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    paths:
      - 'src/**'
      - '.github/workflows/test-python.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install numpy

      - name: Check Python syntax
        run: |
          python -m py_compile src/kamlux.py
          echo "Syntax check passed"

      - name: Run static analysis
        run: |
          pip install ruff
          ruff check src/kamlux.py || true

      - name: Test imports
        run: |
          python -c "
            import sys
            sys.path.insert(0, 'src')
            # Just check imports work (without running)
            print('Import check would require: numpy, subprocess, etc.')
          "
