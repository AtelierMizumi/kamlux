name: Test Python Script

on:
  push:
    paths:
      - 'src/**'
      - '.github/workflows/test-python.yml'
  pull_request:
    paths:
      - 'src/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install numpy

      - name: Check Python syntax
        run: python -m py_compile src/kamlux.py

      - name: Run ruff linter
        run: |
          pip install ruff
          ruff check src/kamlux.py

      - name: Verify script can be imported
        run: python -c "import ast; ast.parse(open('src/kamlux.py').read())"
