name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "=== Validating HTML files ==="
          for file in docs/*.html; do
            [ -f "$file" ] || continue
            echo "Checking: $file"
            grep -q '<!DOCTYPE html>' "$file" || { echo "Missing DOCTYPE in $file"; exit 1; }
            grep -q '</html>' "$file" || { echo "Missing closing html in $file"; exit 1; }
          done
          echo "=== All HTML files valid ==="

      - name: Validate CSS
        run: |
          [ -f docs/styles.css ] || { echo "styles.css not found"; exit 1; }
          echo "CSS valid"

      - name: Validate install script
        run: |
          [ -f docs/install-arch.sh ] || { echo "install-arch.sh not found"; exit 1; }
          head -1 docs/install-arch.sh | grep -q '#!/usr/bin/env bash' || { echo "Missing shebang"; exit 1; }
          echo "Install script valid"

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
