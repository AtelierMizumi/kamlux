name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  pull_request:
    paths:
      - 'docs/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          for file in docs/*.html; do
            [ -f "$file" ] || continue
            grep -q '<!DOCTYPE html>' "$file" || exit 1
            grep -q '</html>' "$file" || exit 1
          done

      - name: Check required files
        run: |
          ls docs/index.html docs/install.html docs/about.html docs/styles.css docs/install-arch.sh

      - name: Summary
        run: echo "✓ Website validation passed"
