name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          echo "=== Validating HTML files ==="
          for file in docs/*.html; do
            [ -f "$file" ] || continue
            echo "Checking: $file"
            grep -q '<!DOCTYPE html>' "$file" || { echo "Missing DOCTYPE in $file"; exit 1; }
            grep -q '</html>' "$file" || { echo "Missing closing html in $file"; exit 1; }
            grep -q '<head>' "$file" || { echo "Missing head in $file"; exit 1; }
            grep -q '</head>' "$file" || { echo "Missing closing head in $file"; exit 1; }
            grep -q '<body>' "$file" || { echo "Missing body in $file"; exit 1; }
            echo "  ✓ $file"
          done
          echo "=== All HTML files valid ==="

      - name: Validate CSS exists
        run: |
          [ -f docs/styles.css ] || { echo "styles.css not found"; exit 1; }
          wc -l docs/styles.css

      - name: Validate install script
        run: |
          [ -f docs/install-arch.sh ] || { echo "install-arch.sh not found"; exit 1; }
          head -1 docs/install-arch.sh | grep -q '#!/usr/bin/env bash' || exit 1
          [ -x docs/install-arch.sh ] || exit 1

      - name: Check required pages exist
        run: |
          [ -f docs/index.html ] || exit 1
          [ -f docs/install.html ] || exit 1
          [ -f docs/about.html ] || exit 1

      - name: Summary
        run: |
          echo "=== Website Validation Passed ==="

  deploy-cloudflare:
    needs: validate
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kamlux
          directory: docs

  deploy-github-pages:
    needs: validate
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN == ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
