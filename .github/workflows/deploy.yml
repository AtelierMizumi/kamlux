name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/deploy.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML structure
        run: |
          for file in docs/*.html; do
            [ -f "$file" ] || continue
            grep -q '<!DOCTYPE html>' "$file" || { echo "Missing DOCTYPE: $file"; exit 1; }
            grep -q '</html>' "$file" || { echo "Missing closing html: $file"; exit 1; }
            grep -q '<head>' "$file" || { echo "Missing head: $file"; exit 1; }
            grep -q '<body>' "$file" || { echo "Missing body: $file"; exit 1; }
            echo "OK: $file"
          done

      - name: Validate required files
        run: |
          ls docs/index.html docs/install.html docs/about.html docs/styles.css docs/install-arch.sh

      - name: Summary
        run: echo "✓ Website validation passed"

  deploy-cloudflare:
    needs: validate
    if: github.ref == 'refs/heads/main' && secrets.CLOUDFLARE_API_TOKEN != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: kamlux
          directory: docs

  deploy-github:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
        with:
          enablement: 'true'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - uses: actions/deploy-pages@v4
